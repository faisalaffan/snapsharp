<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <!-- Background -->
  <rect width="1200" height="600" fill="#0D1B2A"/>
  <!-- Dot grid pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E3A5F" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- Left section: Logo area -->
  <circle cx="180" cy="220" r="90" fill="#1E3A5F" stroke="#00E676" stroke-width="4"/>
  <path d="M180 100 L260 140 L260 240 C260 300 180 344 180 344 C180 344 100 300 100 240 L100 140 Z" fill="#1E3A5F" stroke="#00E676" stroke-width="3"/>
  <path d="M148 225 L170 252 L216 190" stroke="#00E676" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark -->
  <text x="180" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="52" letter-spacing="4" fill="#00E676">SNAP</text>
  <text x="180" y="418" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="300" font-size="24" fill="#FFFFFF" opacity="0.6">SHARP</text>

  <!-- Accent divider -->
  <line x1="400" y1="60" x2="400" y2="540" stroke="#00E676" stroke-width="2" opacity="0.3"/>

  <!-- Right section: Code window -->
  <rect x="440" y="120" width="700" height="360" rx="10" fill="#141D2B" stroke="#1E3A5F" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="440" y="120" width="700" height="36" rx="10" fill="#1E3A5F"/>
  <rect x="440" y="146" width="700" height="10" fill="#1E3A5F"/>
  <circle cx="460" cy="138" r="6" fill="#FF5F56"/>
  <circle cx="482" cy="138" r="6" fill="#FFBD2E"/>
  <circle cx="504" cy="138" r="6" fill="#27C93F"/>

  <!-- Code lines -->
  <text x="470" y="200" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#FFFFFF" opacity="0.7">using <tspan fill="#00E676">SnapSharp</tspan>;</text>
  <text x="470" y="235" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#FFFFFF" opacity="0.5"/>
  <text x="470" y="270" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#FFFFFF" opacity="0.7">var client = <tspan fill="#00E676">new</tspan> <tspan fill="#4FC3F7">SnapSharpClient</tspan>(options);</text>
  <text x="470" y="305" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#FFFFFF" opacity="0.5"/>
  <text x="470" y="340" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#FFFFFF" opacity="0.7">var token = await client.Auth<tspan fill="#00E676">.</tspan>GetAccessTokenAsync();</text>
  <text x="470" y="375" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#FFFFFF" opacity="0.5"/>
  <text x="470" y="410" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#FFFFFF" opacity="0.7">var balance = await client.Account<tspan fill="#00E676">.</tspan>GetBalanceAsync(tspan fill="#FFFFFF" opacity="0.5">...);</tspan></text>

  <!-- Badges -->
  <rect x="440" y="510" width="130" height="28" rx="6" fill="#1E3A5F"/>
  <text x="505" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#00E676" font-weight="600">.NET 8</text>
  <rect x="585" y="510" width="170" height="28" rx="6" fill="#1E3A5F"/>
  <text x="670" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#00E676" font-weight="600">Zero Dependencies</text>
  <rect x="770" y="510" width="190" height="28" rx="6" fill="#1E3A5F"/>
  <text x="865" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#00E676" font-weight="600">BI SNAP Compliant</text>
</svg>
